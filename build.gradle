plugins {
	id 'fabric-loom' version '1.15.5'
}

/* ---------------------------------------------------------------------------
 * Target Minecraft version
 *
 *   gradlew build                 -> universal jar (1.20.1 - 1.20.4)
 *   gradlew build -Pmcver=1.20.4  -> compile/run verification for 1.20.4 (not a release)
 *   gradlew build -Pmcver=1.21.11 -> 1.21.11 compatibility build (separate artifact)
 *
 * Dependencies and the fabric.mod.json compatibility range live in
 * gradle/versions/<mcver>.properties.
 * ------------------------------------------------------------------------- */
def mcver = providers.gradleProperty('mcver').orElse('1.20.1').get()
def versionFile = file("gradle/versions/${mcver}.properties")

if (!versionFile.exists()) {
	throw new GradleException("Unknown mcver '${mcver}': ${versionFile} does not exist.")
}

def versionProps = new Properties()
versionFile.withReader('UTF-8') { versionProps.load(it) }

def vprop = { String key ->
	def value = versionProps.getProperty(key)

	if (value == null) {
		throw new GradleException("Missing '${key}' in ${versionFile}.")
	}

	return value
}

def minecraftVersion = vprop('minecraft_version')
def minecraftRange = vprop('minecraft_range')
def bbsVersion = vprop('bbs_version')
def bbsRange = vprop('bbs_range')
def artifactSuffix = versionProps.getProperty('artifact_suffix', minecraftVersion)
def javaRelease = versionProps.getProperty('java_release', '17') as int
def loaderRange = versionProps.getProperty('loader_range', '>=0.15.6')
def javaRange = versionProps.getProperty('java_range', '>=17')
def mixinCompatibility = versionProps.getProperty('mixin_compatibility', 'JAVA_17')

version = project.mod_version + "-" + artifactSuffix
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

/* 1.20.1 compatible builds use build/; 1.20.4 verification builds use a separate dir. */
if (mcver != '1.20.1') {
	layout.buildDirectory.set(file("build-${mcver}"))
}

repositories {
	/* Prefer a regional mirror: Aliyun's public Maven repository speeds up downloads. */
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'AliyunCentral'
		url = 'https://maven.aliyun.com/repository/central'
	}
	/* BBS is published here by `gradlew publishToMavenLocal` in the BBS repository. There is
	 * no public repository for it. */
	mavenLocal()
}

def clientRunDir = mcver == '1.20.1' ? 'run' : "run-${mcver}-client"
def serverRunDir = mcver == '1.20.1' ? 'run' : "run-${mcver}-server"

loom {
	splitEnvironmentSourceSets()

	/* Loom 1.15 remaps mixin annotations in remapJar directly, so no refmap is generated
	 * or needed. Do not add a loom.mixin/defaultRefmapName block: that only enables the
	 * legacy Mixin AP and prints a deprecation warning. */

	mods {
		"bbs_together" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	/* Dev run directories: 1.20.1 uses run/; the 1.20.4 client and server each get
	 * their own directory so worlds, logs and configs never overwrite each other. */
	runs {
		client {
			client()
			ideConfigGenerated true
			runDir = clientRunDir
			/* Give the Minecraft dev environment enough heap. */
			vmArg '-Xmx3G'
			vmArg '-Xms1G'

			/* Optional: -PjoinServer=127.0.0.1:25565 makes the client join on launch for smoke tests. */
			if (providers.gradleProperty('joinServer').isPresent()) {
				programArgs '--quickPlayMultiplayer', providers.gradleProperty('joinServer').get()
			}
		}
		server {
			server()
			ideConfigGenerated true
			runDir = serverRunDir
			vmArg '-Xmx2G'
			vmArg '-Xms512M'
		}

		/* Optional second 1.21.11 client for two-player stress tests. It must use
		 * its own run directory: sharing run-1.21.11-client would lock the same
		 * processed-mod jars. */
		if (mcver == '1.21.11') {
			client2 {
				client()
				ideConfigGenerated true
				runDir = 'run-1.21.11-client-b'
				vmArg '-Xmx3G'
				vmArg '-Xms1G'

				if (providers.gradleProperty('joinServer').isPresent()) {
					programArgs '--quickPlayMultiplayer', providers.gradleProperty('joinServer').get()
				}
			}
		}
	}
}

/* 1.20.x keeps its version-specific adapters in java-1.20. 1.21.11 replaces
 * them with the payload/authlib/render overlays in java-1.21.11. */
if (mcver == '1.21.11') {
	sourceSets.main.java.setSrcDirs(['src/main/java', 'src/main/java-1.21.11'])
	sourceSets.main.resources.setSrcDirs(['src/main/resources-1.21.11', 'src/main/resources'])
	sourceSets.client.java.setSrcDirs(['src/client/java', 'src/client/java-1.21.11'])
	sourceSets.client.resources.setSrcDirs(['src/client/resources-1.21.11', 'src/client/resources'])

	/* The 1.21.11 build draws the lock badge from a WorldRenderEvents hook instead
	 * of this render-state mixin; the 1.20 build keeps the mixin in java/. */
	sourceSets.client.java.exclude(
		'mchorse/bbs_together/mixin/ModelBlockEntityRendererBbsOpMixin.java'
	)
} else {
	sourceSets.main.java.srcDir('src/main/java-1.20')
	sourceSets.client.java.srcDir('src/client/java-1.20')
}

dependencies {
	// Version-specific coordinates are defined in gradle/versions/<mcver>.properties
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings "net.fabricmc:yarn:${vprop('yarn_mappings')}:v2"
	modImplementation "net.fabricmc:fabric-loader:${vprop('loader_version')}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${vprop('fabric_version')}"

	/* BBS 2.7 dependency. transitive = false keeps BBS's own Sodium, Iris and glsl-transformer
	 * out of this build. The consequence is worth knowing: the dev client then runs BBS without
	 * Sodium and Iris, its mixins into them are skipped with a warning. */
	modImplementation("mchorse:bbs:${bbsVersion}") { transitive = false }
}

/* Force LWJGL 3.3.1 for Sodium compatibility on 1.20.x (Loom defaults to
 * 3.3.2-snapshot). 1.21.11 uses a newer LWJGL/Sodium generation, so leave it alone. */
if (javaRelease < 21) {
	configurations.all {
		resolutionStrategy {
			force "org.lwjgl:lwjgl:3.3.1"
			force "org.lwjgl:lwjgl-glfw:3.3.1"
			force "org.lwjgl:lwjgl-openal:3.3.1"
			force "org.lwjgl:lwjgl-opengl:3.3.1"
			force "org.lwjgl:lwjgl-stb:3.3.1"
			force "org.lwjgl:lwjgl-tinyfd:3.3.1"
		}
	}
}

/* Loom caches the remapped BBS by its Maven coordinates, and BBS's version does not change while
 * it is being worked on 鈥?so a rebuilt BBS is silently ignored. This notices on its own: if the
 * published jar is newer than the cached remap, the cache goes. */
def bbsJar = new File(new File(System.getProperty("user.home")), ".m2/repository/mchorse/bbs/${bbsVersion}/bbs-${bbsVersion}.jar")
def remapCache = file(".gradle/loom-cache/remapped_mods/remapped/mchorse")

if (bbsJar.exists() && remapCache.exists() && bbsJar.lastModified() > remapCache.lastModified()) {
	logger.lifecycle("BBS was rebuilt since it was last remapped 鈥?clearing ${remapCache}")
	delete(remapCache)
}

processResources {
	/* 1.21.11 has both a common and an overlay resource dir. The overlay comes
	 * first in the source-set order, so EXCLUDE keeps its fabric.mod.json and
	 * mixin config and drops the common duplicates. */
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version
	inputs.property "minecraft_range", minecraftRange
	inputs.property "bbs_range", bbsRange
	inputs.property "loader_range", loaderRange
	inputs.property "java_range", javaRange
	inputs.property "mixin_compatibility", mixinCompatibility

	filesMatching("fabric.mod.json") {
		expand(
			"version": project.version,
			"minecraft_range": minecraftRange,
			"bbs_range": bbsRange,
			"loader_range": loaderRange,
			"java_range": javaRange
		)
	}

	filesMatching("*.mixins.json") {
		filter { line -> line.replace('${mixin_compatibility}', mixinCompatibility) }
	}
}

/* The client mixin config is processed by the split-source-set task, not by
 * processResources. Keep its compatibility level in sync with the target. */
tasks.named('processClientResources') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "mixin_compatibility", mixinCompatibility

	filesMatching("*.mixins.json") {
		filter { line -> line.replace('${mixin_compatibility}', mixinCompatibility) }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

/* 1.21.11 is compiled by a Java 21 toolchain; 1.20.x keeps the existing
 * "any Java 17+ JDK with --release 17" behaviour. */
if (javaRelease >= 21) {
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(javaRelease)
		}
	}
}

/* ---------------------------------------------------------------------------
 * Convenience tasks: a nested Gradle build switches mcver, which avoids -P
 * arguments being truncated under PowerShell. build/runClient default to 1.20.1;
 * 1.20.4 is only used for compile and run verification.
 * ------------------------------------------------------------------------- */
def registerVersionTask = { String name, String target, List<String> taskList, String description ->
	tasks.register(name, GradleBuild) {
		group = 'fabric'
		description = description
		dir = rootDir
		tasks = taskList
		def props = [mcver: target]
		/* Forward the optional auto-join address so nested run tasks can smoke-test a server. */
		if (providers.gradleProperty('joinServer').isPresent()) {
			props.joinServer = providers.gradleProperty('joinServer').get()
		}
		startParameter.projectProperties = props
	}
}

registerVersionTask('build1204', '1.20.4', ['build'], 'Compile/run verification for 1.20.4; the artifact is for testing only.')
registerVersionTask('runClient1204', '1.20.4', ['runClient'], 'Start the dev client on 1.20.4 (run-1.20.4-client/).')
registerVersionTask('runServer1204', '1.20.4', ['runServer'], 'Start the dev server on 1.20.4 (run-1.20.4-server/).')

registerVersionTask('build12111', '1.21.11', ['build'], 'Build the 1.21.11 compatibility target.')
registerVersionTask('runClient12111', '1.21.11', ['runClient'], 'Start the dev client on 1.21.11 (run-1.21.11-client/).')
registerVersionTask('runClient12111B', '1.21.11', ['runClient2'], 'Start a second dev client on 1.21.11 (run-1.21.11-client-b/) for two-player tests.')
registerVersionTask('runServer12111', '1.21.11', ['runServer'], 'Start the dev server on 1.21.11 (run-1.21.11-server/).')
