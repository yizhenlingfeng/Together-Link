plugins {
	id 'fabric-loom' version '1.15.5'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	/* 国内镜像优先：阿里云公共 Maven 仓库，加速依赖下载 */
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'AliyunCentral'
		url = 'https://maven.aliyun.com/repository/central'
	}
	/* BBS is published here by `gradlew publishToMavenLocal` in the BBS repository. There is
	 * no public repository for it. */
	mavenLocal()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs_together" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	/* 开发运行配置：客户端与服务端共享同一游戏目录，避免重复生成 run 目录 */
	runs {
		client {
			client()
			ideConfigGenerated true
			runDir = "run"
			/* 给 Minecraft 开发环境分配足够堆内存 */
			vmArg '-Xmx3G'
			vmArg '-Xms1G'
		}
		server {
			server()
			ideConfigGenerated true
			runDir = "run"
			vmArg '-Xmx2G'
			vmArg '-Xms512M'
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	/* BBS 2.6 dependency. transitive = false keeps BBS's own Sodium, Iris and glsl-transformer
	 * out of this build. The consequence is worth knowing: the dev client then runs BBS without
	 * Sodium and Iris, its mixins into them are skipped with a warning. */
	modImplementation("mchorse:bbs:${project.bbs_version}") { transitive = false }
}

/* 强制 LWJGL 3.3.1 以兼容 Sodium（Loom 默认使用 3.3.2-snapshot，Sodium 要求 3.3.1） */
configurations.all {
	resolutionStrategy {
		force "org.lwjgl:lwjgl:3.3.1"
		force "org.lwjgl:lwjgl-glfw:3.3.1"
		force "org.lwjgl:lwjgl-openal:3.3.1"
		force "org.lwjgl:lwjgl-opengl:3.3.1"
		force "org.lwjgl:lwjgl-stb:3.3.1"
		force "org.lwjgl:lwjgl-tinyfd:3.3.1"
	}
}

/* Loom caches the remapped BBS by its Maven coordinates, and BBS's version does not change while
 * it is being worked on — so a rebuilt BBS is silently ignored. This notices on its own: if the
 * published jar is newer than the cached remap, the cache goes. */
def bbsJar = new File(new File(System.getProperty("user.home")), ".m2/repository/mchorse/bbs/${project.bbs_version}/bbs-${project.bbs_version}.jar")
def remapCache = file(".gradle/loom-cache/remapped_mods/remapped/mchorse")

if (bbsJar.exists() && remapCache.exists() && bbsJar.lastModified() > remapCache.lastModified()) {
	logger.lifecycle("BBS was rebuilt since it was last remapped — clearing ${remapCache}")
	delete(remapCache)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
