# Minecraft 1.20.4 verification target.
# Not a release artifact: it exists to compile/run the same sources against 1.20.4.
minecraft_version=1.20.4
minecraft_range=~1.20.4
artifact_suffix=1.20.4-verify

yarn_mappings=1.20.4+build.3
loader_version=0.16.14
fabric_version=0.97.3+1.20.4

# BBS 2.7 1.20.4 build; must be published to mavenLocal first.
# Fabric treats 2.7-1.20.4 as a pre-release of 2.7, so ">=2.7" would reject it.
bbs_version=2.7-1.20.4
bbs_range=>=2.7-1.20.4
