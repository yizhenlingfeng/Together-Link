# Minecraft 1.20.1 / 1.20.4 universal build target.
# The jar is compiled against 1.20.1; 1.20.4-only APIs are bridged through reflection.
minecraft_version=1.20.1
minecraft_range=>=1.20.1 <=1.20.4

# Release artifact is named together-link-<mod_version>-1.20.1-1.20.4.jar
artifact_suffix=1.20.1-1.20.4

yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_version=0.92.1+1.20.1

# Published by the BBS repository via `gradlew publishToMavenLocal`.
# 2.7 is a hard floor: KeyframeChannel.putLoop/removeLoop and Keyframe.setMotionShift
# do not exist before 2.7, and both mixin configs use defaultRequire 1, so a 2.6
# install would fail to apply those injectors and crash on startup.
# The range keeps the "-1.20.1" suffix on purpose: BBS ships 2.7 as a prerelease,
# and a prerelease sorts below its release, so a plain ">=2.7" rejects 2.7-1.20.1.
# ">=2.7-1.20.1" accepts 2.7-1.20.1, 2.7-1.20.4 and anything later.
bbs_version=2.7-1.20.1
bbs_range=>=2.7-1.20.1
