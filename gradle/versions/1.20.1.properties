# Minecraft 1.20.1 / 1.20.4 universal build target.
# The jar is compiled against 1.20.1; 1.20.4-only APIs are bridged through reflection.
minecraft_version=1.20.1
minecraft_range=>=1.20.1 <=1.20.4

# Release artifact is named together-link-<mod_version>-1.20.1-1.20.4.jar
artifact_suffix=1.20.1-1.20.4

yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_version=0.92.1+1.20.1

# Published by the BBS repository via `gradlew publishToMavenLocal`.
# Both 2.7-1.20.1 and 2.7-1.20.4 satisfy >=2.6; public 2.3.3 is rejected.
bbs_version=2.7-1.20.1
bbs_range=>=2.6
