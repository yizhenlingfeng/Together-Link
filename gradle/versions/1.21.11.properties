# Minecraft 1.21.11 framework target.
#
# 1.20.x remains the primary target. This build exists so the version-specific
# build/dev-client plumbing is ready; the 1.20 gameplay content is NOT compiled
# against 1.21.11 yet (see src/main/java-1.21.11 and src/client/java-1.21.11).
minecraft_version=1.21.11
minecraft_range=~1.21.11
artifact_suffix=1.21.11

yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.4+1.21.11

# BBS 2.7 1.21.11 build; publish it to mavenLocal first (lib/bbs-fs-1.21.11).
# Fabric treats 2.7-1.21.11 as a pre-release of 2.7, so ">=2.7" would reject it.
bbs_version=2.7-1.21.11
bbs_range=>=2.7-1.21.11

# 1.21.11 runs on Java 21, and its mixin configs must use JAVA_21.
loader_range=>=0.19.3
java_range=>=21
java_release=21
mixin_compatibility=JAVA_21
